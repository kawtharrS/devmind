[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "devmind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "chromadb",
    "click",
    "tiktoken",
    "rich",
    "gitpython",
]

[project.scripts]
devmind = "devmind.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["devmind*"]
